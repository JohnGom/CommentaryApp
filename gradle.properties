org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Los targets de iOS se declaran solo con este flag en true. Mientras Xcode no
# esté instalado debe quedarse en false: declarar un target nativo sin Xcode
# rompe la configuración del proyecto.
comentario.enableIos=false
